name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U todo"
          --health-interval 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todo?schema=public
      # Prisma 契約テスト用(全削除するため本体とは別の DB)
      TEST_DATABASE_URL: postgresql://todo:todo@localhost:5432/todo_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - name: Prepare test database
        run: |
          PGPASSWORD=todo psql -h localhost -U todo -d todo -c 'CREATE DATABASE todo_test'
          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy
      - name: Test (スキップが 1 件でもあれば失敗させ、契約テストの素通りを防ぐ)
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
          ! grep -E "Tests .*skipped" test.log
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
